name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: test
          load: true
          tags: tmsc-test:${{ github.sha }}
          cache-from: type=gha,scope=tmsc-test
          cache-to: type=gha,scope=tmsc-test,mode=max

      - name: Tests
        run: docker run --rm tmsc-test:${GITHUB_SHA}
