name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Check frontend quality
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: frontend-quality
          load: true
          tags: tmsc-frontend-quality:${{ github.sha }}
          cache-from: type=gha,scope=tmsc-frontend-quality
          cache-to: type=gha,scope=tmsc-frontend-quality,mode=max

      - name: Build PHP quality image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: test
          load: true
          tags: tmsc-php-quality:${{ github.sha }}
          cache-from: type=gha,scope=tmsc-test
          cache-to: type=gha,scope=tmsc-test,mode=max

      - name: Check PHP formatting
        run: docker run --rm tmsc-php-quality:${GITHUB_SHA} vendor/bin/pint --test
