name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: tmsc-msmt02
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend quality
        run: docker build --target frontend-quality --tag tmsc-frontend-quality:${GITHUB_SHA} .

      - name: Build PHP quality image
        run: docker build --target test --tag tmsc-php-quality:${GITHUB_SHA} .

      - name: Check PHP formatting
        run: docker run --rm tmsc-php-quality:${GITHUB_SHA} vendor/bin/pint --test
